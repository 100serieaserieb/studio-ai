<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b14;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 30px;
    }

    header {
      padding: 22px 18px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .logo span {
      color: #7c5cff;
    }

    .status {
      background: #151a2a;
      border: 1px solid #292f43;
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 12px;
      color: #aeb7d0;
    }

    .hero {
      padding: 25px 18px 15px;
    }

    .hero h1 {
      font-size: 32px;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .hero h1 span {
      color: #8d73ff;
    }

    .hero p {
      color: #8f98b0;
      line-height: 1.5;
      font-size: 15px;
    }

    .chat-box {
      margin: 18px;
      background: #111625;
      border: 1px solid #252c41;
      border-radius: 22px;
      padding: 15px;
      box-shadow: 0 10px 35px rgba(0,0,0,.25);
    }

    textarea {
      width: 100%;
      min-height: 105px;
      resize: none;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 16px;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: #626b83;
    }

    .chat-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .upload-btn {
      background: #1b2132;
      border: 1px solid #30384f;
      color: #dce1f1;
      border-radius: 13px;
      padding: 10px 13px;
      cursor: pointer;
      font-size: 14px;
    }

    .send-btn {
      border: none;
      background: #7c5cff;
      color: white;
      padding: 11px 18px;
      border-radius: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .send-btn:active,
    .upload-btn:active,
    .feature:active {
      transform: scale(.97);
    }

    #fileInput {
      display: none;
    }

    .preview {
      display: none;
      margin-top: 12px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #30384f;
    }

    .preview img {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      background: #080b14;
    }

    .section-title {
      padding: 15px 18px 10px;
      font-size: 18px;
      font-weight: 700;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
      padding: 0 18px;
    }

    .feature {
      background: #111625;
      border: 1px solid #252c41;
      border-radius: 17px;
      padding: 17px 14px;
      color: white;
      text-align: left;
      cursor: pointer;
      transition: .15s;
    }

    .feature-icon {
      font-size: 25px;
      margin-bottom: 9px;
    }

    .feature-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .feature-text {
      color: #788198;
      font-size: 12px;
      line-height: 1.3;
    }

    .subjects {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 5px 18px 15px;
    }

    .subject {
      white-space: nowrap;
      padding: 9px 13px;
      border-radius: 20px;
      background: #111625;
      border: 1px solid #252c41;
      color: #aeb7d0;
      font-size: 13px;
    }

    .subject.active {
      background: #211a46;
      border-color: #7659ef;
      color: white;
    }

    .message {
      display: none;
      margin: 18px;
      padding: 15px;
      border-radius: 16px;
      background: #151b2b;
      border: 1px solid #30384f;
      color: #dbe0ef;
      line-height: 1.5;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #555e76;
      font-size: 11px;
      padding: 30px 15px 10px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">🤖 Study<span>AI</span></div>
    <div class="status">● Pronto</div>
  </header>

  <section class="hero">
    <h1>Studia meglio.<br><span>Impara davvero.</span></h1>
    <p>
      Invia una domanda, una foto del compito o scegli uno strumento.
      Study AI ti aiuterà a capire e studiare.
    </p>
  </section>

  <div class="chat-box">

    <textarea id="question"
      placeholder="Scrivi qui la tua domanda..."></textarea>

    <div class="chat-actions">

      <label class="upload-btn">
        📸 Foto
        <input type="file" id="fileInput" accept="image/*">
      </label>

      <button class="send-btn" onclick="sendQuestion()">
        Invia ➜
      </button>

    </div>

    <div class="preview" id="preview">
      <img id="previewImage">
    </div>

  </div>

  <div class="section-title">📚 Cosa vuoi fare?</div>

  <div class="features">

    <button class="feature" onclick="selectTool('Correggi il mio compito')">
      <div class="feature-icon">✏️</div>
      <div class="feature-title">Correggi compito</div>
      <div class="feature-text">Trova errori e spiegami come correggerli.</div>
    </button>

    <button class="feature" onclick="selectTool('Fammi un riassunto')">
      <div class="feature-icon">📚</div>
      <div class="feature-title">Riassunto</div>
      <div class="feature-text">Trasforma un testo lungo in un riassunto.</div>
    </button>

    <button class="feature" onclick="selectTool('Crea una mappa concettuale')">
      <div class="feature-icon">🧠</div>
      <div class="feature-title">Mappa concettuale</div>
      <div class="feature-text">Organizza gli argomenti in modo semplice.</div>
    </button>

    <button class="feature" onclick="selectTool('Crea uno schema per studiare')">
      <div class="feature-icon">📝</div>
      <div class="feature-title">Schema</div>
      <div class="feature-text">Crea uno schema ordinato e facile da memorizzare.</div>
    </button>

    <button class="feature" onclick="selectTool('Dammi le parole chiave da ricordare')">
      <div class="feature-icon">🔑</div>
      <div class="feature-title">Parole chiave</div>
      <div class="feature-text">Individua ciò che devi assolutamente ricordare.</div>
    </button>

    <button class="feature" onclick="selectTool('Verifica queste informazioni sul web')">
      <div class="feature-icon">🌐</div>
      <div class="feature-title">Verifica sul web</div>
      <div class="feature-text">Controlla le informazioni e trova fonti.</div>
    </button>

    <button class="feature" onclick="selectTool('Spiegami questo argomento in modo semplice')">
      <div class="feature-icon">💡</div>
      <div class="feature-title">Spiegazione</div>
      <div class="feature-text">Spiegazioni semplici, passo dopo passo.</div>
    </button>

    <button class="feature" onclick="selectTool('Fammi delle domande per ripassare')">
      <div class="feature-icon">🎯</div>
      <div class="feature-title">Ripasso</div>
      <div class="feature-text">Allenati con domande e quiz.</div>
    </button>

  </div>

  <div class="section-title">📖 Materia</div>

  <div class="subjects">
    <div class="subject active">Generale</div>
    <div class="subject">Matematica</div>
    <div class="subject">Italiano</div>
    <div class="subject">Storia</div>
    <div class="subject">Geografia</div>
    <div class="subject">Scienze</div>
    <div class="subject">Inglese</div>
  </div>

  <div class="message" id="message"></div>

  <footer>
    Study AI • Assistente intelligente per lo studio
  </footer>

</div>

<script>

  const question = document.getElementById("question");
  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");
  const previewImage = document.getElementById("previewImage");
  const message = document.getElementById("message");

  fileInput.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
      previewImage.src = e.target.result;
      preview.style.display = "block";
    };

    reader.readAsDataURL(file);

    question.value = "Analizza questa foto e aiutami a svolgere correttamente il compito.";
  });

  function selectTool(text) {
    question.value = text;
    question.focus();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  function sendQuestion() {

    const text = question.value.trim();

    if (!text && !fileInput.files.length) {
      showMessage("✏️ Scrivi una domanda oppure carica una foto del compito.");
      return;
    }

    showMessage(
      "✅ Richiesta ricevuta!<br><br>" +
      "Questa è la prima versione dell'app. " +
      "Il prossimo passaggio sarà collegare l'intelligenza artificiale vera, " +
      "così potrà leggere le foto, rispondere alle domande, correggere i compiti " +
      "e verificare le informazioni sul web."
    );
  }

  function showMessage(text) {
    message.innerHTML = text;
    message.style.display = "block";

    message.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }

  document.querySelectorAll(".subject").forEach(subject => {

    subject.addEventListener("click", function() {

      document.querySelectorAll(".subject")
        .forEach(s => s.classList.remove("active"));

      this.classList.add("active");

    });

  });

</script>

</body>
</html>
